[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  conditions = {Role = ["*"]}

# Custom error page
[[redirects]]
  from = "/404"
  to = "/index.html"
  status = 404

# Pretty URLs (optional - redirects from .html to without extension)
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/visas"
  to = "/visas.html"
  status = 200

[[redirects]]
  from = "/immigration"
  to = "/immigration.html"
  status = 200

[[redirects]]
  from = "/insurance"
  to = "/insurance.html"
  status = 200

[[redirects]]
  from = "/company-formation"
  to = "/company-formation.html"
  status = 200

[[redirects]]
  from = "/manpower-recruitment"
  to = "/manpower-recruitment.html"
  status = 200

[[redirects]]
  from = "/verify"
  to = "/verify.html"
  status = 200

[[redirects]]
  from = "/sim"
  to = "/sim.html"
  status = 200

[[redirects]]
  from = "/edu"
  to = "/edu.html"
  status = 200

[[redirects]]
  from = "/news-media"
  to = "/news-media.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML files - shorter cache
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
